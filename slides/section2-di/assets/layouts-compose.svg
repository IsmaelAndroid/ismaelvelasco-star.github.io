<text x="450" y="42" text-anchor="middle" font-size="24" fill="#37474F" font-weight="bold">Los contenedores de Compose: cada uno ordena a su manera</text><rect x="20" y="70" width="190" height="190" rx="12" fill="#FFFFFF" stroke="#79747E" stroke-width="1"/><text x="115" y="96" text-anchor="middle" font-size="16" fill="#6750A4" font-weight="bold">Column</text><rect x="85" y="120" width="90" height="26" rx="13" fill="#EADDFF"/><rect x="75" y="152" width="110" height="26" rx="13" fill="#EADDFF"/><rect x="95" y="184" width="70" height="26" rx="13" fill="#EADDFF"/><text x="115" y="252" text-anchor="middle" font-size="11" fill="#9E9E9E">apila en vertical ↓</text><rect x="215" y="70" width="190" height="190" rx="12" fill="#FFFFFF" stroke="#79747E" stroke-width="1"/><text x="310" y="96" text-anchor="middle" font-size="16" fill="#6750A4" font-weight="bold">Row</text><rect x="239" y="120" width="34" height="90" rx="10" fill="#EADDFF"/><rect x="275" y="120" width="34" height="90" rx="10" fill="#EADDFF"/><rect x="311" y="120" width="34" height="90" rx="10" fill="#EADDFF"/><text x="310" y="252" text-anchor="middle" font-size="11" fill="#9E9E9E">en fila →</text><rect x="405" y="70" width="190" height="190" rx="12" fill="#FFFFFF" stroke="#79747E" stroke-width="1"/><text x="500" y="96" text-anchor="middle" font-size="16" fill="#6750A4" font-weight="bold">Box</text><rect x="430" y="120" width="110" height="80" rx="10" fill="#EADDFF"/><rect x="450" y="140" width="110" height="80" rx="10" fill="#C9B9E8"/><text x="500" y="252" text-anchor="middle" font-size="11" fill="#9E9E9E">superpuestos</text><rect x="595" y="70" width="190" height="190" rx="12" fill="#FFFFFF" stroke="#79747E" stroke-width="1"/><text x="690" y="96" text-anchor="middle" font-size="16" fill="#6750A4" font-weight="bold">LazyVerticalGrid</text><rect x="626" y="115" width="48" height="38" rx="8" fill="#EADDFF"/><rect x="682" y="115" width="48" height="38" rx="8" fill="#EADDFF"/><rect x="738" y="115" width="48" height="38" rx="8" fill="#EADDFF"/><rect x="626" y="161" width="48" height="38" rx="8" fill="#EADDFF"/><rect x="682" y="161" width="48" height="38" rx="8" fill="#EADDFF"/><rect x="738" y="161" width="48" height="38" rx="8" fill="#EADDFF"/><text x="690" y="252" text-anchor="middle" font-size="11" fill="#9E9E9E">rejilla N×M</text><text x="450" y="305" text-anchor="middle" font-size="14" fill="#607D8B">Arrangement.spacedBy(8.dp) = separación · Alignment = alineación · weight(1f) = reparte el espacio</text></svg>