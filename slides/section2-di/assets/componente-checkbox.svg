<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Roboto, Segoe UI, Arial, sans-serif">
<rect width="900" height="300" fill="#FAFAFD" rx="0"/>
<text x="450" y="40" text-anchor="middle" font-size="24" fill="#37474F" font-weight="bold">Checkbox — marcar varias (o ninguna)</text><rect x="80" y="80" width="26" height="26" rx="6" fill="#6750A4"/><text x="93" y="100" text-anchor="middle" font-size="18" fill="#FFFFFF" font-weight="bold">✓</text><text x="122" y="100" text-anchor="start" font-size="15" fill="#1D1B20">Acepto los términos</text><rect x="80" y="135" width="26" height="26" rx="6" fill="#FAFAFD" stroke="#79747E" stroke-width="2"/><text x="122" y="155" text-anchor="start" font-size="15" fill="#1D1B20">Recibir novedades</text><rect x="80" y="190" width="26" height="26" rx="6" fill="#E0E0E0"/><text x="93" y="210" text-anchor="middle" font-size="18" fill="#9E9E9E" font-weight="bold">✓</text><text x="122" y="210" text-anchor="start" font-size="15" fill="#9E9E9E">Modo oscuro (deshabilitado)</text><text x="600" y="100" text-anchor="start" font-size="14" fill="#79747E">checked: Boolean → marcado o no</text><text x="600" y="130" text-anchor="start" font-size="14" fill="#79747E">onCheckedChange: reaccionar al cambio</text><text x="600" y="160" text-anchor="start" font-size="14" fill="#79747E">enabled = false → gris, no responde</text><text x="450" y="265" text-anchor="middle" font-size="14" fill="#607D8B">Independientes: cada checkbox tiene su propio estado</text></svg>