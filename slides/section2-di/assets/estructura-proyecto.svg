<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="470" fill="#fafafa"/>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#37474F">¿Dónde vive cada cosa en el proyecto?</text>
  <!-- bloque app/ -->
  <rect x="30" y="70" width="560" height="360" rx="14" fill="#FFF8E1" stroke="#F57F17" stroke-width="2"/>
  <text x="60" y="105" font-size="22" font-weight="bold" fill="#E65100">📁 app/ — el módulo de la app</text>
  <!-- manifests -->
  <rect x="60" y="125" width="240" height="86" rx="10" fill="#FFE082"/>
  <text x="180" y="155" text-anchor="middle" font-size="20">🪪</text>
  <text x="180" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#5d4013">AndroidManifest.xml</text>
  <text x="180" y="199" text-anchor="middle" font-size="12" fill="#5d4013">carta de identidad + permisos</text>
  <!-- kotlin -->
  <rect x="330" y="125" width="240" height="86" rx="10" fill="#FFCC80"/>
  <text x="450" y="155" text-anchor="middle" font-size="20">🧠</text>
  <text x="450" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#4E342E">kotlin+java/</text>
  <text x="450" y="199" text-anchor="middle" font-size="12" fill="#4E342E">MainActivity.kt + composables</text>
  <!-- res -->
  <rect x="60" y="235" width="510" height="120" rx="10" fill="#FFE0B2"/>
  <text x="90" y="265" font-size="17" font-weight="bold" fill="#E65100">🎨 res/ — los recursos (todo lo que NO es código)</text>
  <rect x="80" y="282" width="145" height="55" rx="8" fill="#FFB74D"/>
  <text x="152" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#4E342E">drawable/</text>
  <text x="152" y="322" text-anchor="middle" font-size="11" fill="#4E342E">imágenes</text>
  <rect x="245" y="282" width="145" height="55" rx="8" fill="#FFB74D"/>
  <text x="317" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#4E342E">values/</text>
  <text x="317" y="322" text-anchor="middle" font-size="11" fill="#4E342E">strings.xml · temas</text>
  <rect x="410" y="282" width="145" height="55" rx="8" fill="#FFB74D"/>
  <text x="482" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#4E342E">...y más</text>
  <text x="482" y="322" text-anchor="middle" font-size="11" fill="#4E342E">fuentes, XML de UI</text>
  <!-- nota strings -->
  <rect x="60" y="375" width="510" height="40" rx="8" fill="#FFF3E0" stroke="#FFB300" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="315" y="401" text-anchor="middle" font-size="14" fill="#7a5c00">💡 strings.xml separa los textos del código → traducir la app = cambiar 1 archivo</text>
  <!-- bloque gradle -->
  <rect x="620" y="70" width="310" height="200" rx="14" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="650" y="105" font-size="20" font-weight="bold" fill="#37474F">⚙️ Gradle Scripts/</text>
  <text x="650" y="140" font-size="14" fill="#37474F">▪ build.gradle.kts (Project)</text>
  <text x="650" y="168" font-size="14" fill="#37474F">▪ build.gradle.kts (Module :app)</text>
  <text x="650" y="196" font-size="14" fill="#37474F">▪ settings.gradle.kts</text>
  <text x="650" y="228" font-size="13" fill="#607d8b">La lista de la compra de librerías</text>
  <text x="650" y="248" font-size="13" fill="#607d8b">(aquí vive Jetpack Compose)</text>
  <!-- y con que se construye -->
  <rect x="620" y="300" width="310" height="130" rx="14" fill="#E0F2F1" stroke="#00695C" stroke-width="2"/>
  <text x="775" y="335" text-anchor="middle" font-size="18" font-weight="bold" fill="#00695C">🔨 ¿Y quién construye?</text>
  <text x="775" y="365" text-anchor="middle" font-size="14" fill="#00453c">Gradle: descarga librerías,</text>
  <text x="775" y="387" text-anchor="middle" font-size="14" fill="#00453c">compila y genera el APK.</text>
  <text x="775" y="409" text-anchor="middle" font-size="14" fill="#00453c">Dependencia nueva → Sync</text>
</svg>
