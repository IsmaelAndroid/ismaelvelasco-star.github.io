<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Segoe UI, Roboto, sans-serif" role="img" aria-label="Diagrama: del gesto del usuario al codigo, en Swing y en Compose">
  <rect width="980" height="470" fill="#fbfbf8"/>
  <text x="40" y="42" font-size="21" fill="#263238">Del dedo al código: dos formas de contar el mismo viaje</text>

  <!-- lane 1: libro -->
  <rect x="40" y="66" width="900" height="150" rx="12" fill="#fff8e1" stroke="#f9a825"/>
  <text x="58" y="94" font-size="15" font-weight="bold" fill="#8d6e00">COMO LO CUENTA EL LIBRO (Swing / JavaBeans, 2020)</text>
  <g font-size="14" fill="#37474f">
    <rect x="60" y="112" width="150" height="76" rx="8" fill="#ffffff" stroke="#b0a06a"/>
    <text x="135" y="144" text-anchor="middle">FUENTE</text>
    <text x="135" y="166" text-anchor="middle" font-size="12">el componente</text>
    <rect x="268" y="112" width="170" height="76" rx="8" fill="#ffffff" stroke="#b0a06a"/>
    <text x="353" y="144" text-anchor="middle">OBJETO DE EVENTO</text>
    <text x="353" y="166" text-anchor="middle" font-size="12">MouseEvent, KeyEvent…</text>
    <rect x="496" y="112" width="170" height="76" rx="8" fill="#ffffff" stroke="#b0a06a"/>
    <text x="581" y="144" text-anchor="middle">LISTENER</text>
    <text x="581" y="166" text-anchor="middle" font-size="12">actionPerformed(e)</text>
    <rect x="724" y="112" width="196" height="76" rx="8" fill="#ffffff" stroke="#b0a06a"/>
    <text x="822" y="144" text-anchor="middle">ACCION</text>
    <text x="822" y="166" text-anchor="middle" font-size="12">metodo que cambia el modelo</text>
  </g>
  <g stroke="#8d6e00" stroke-width="2" fill="none" marker-end="url(#f1)">
    <path d="M210 150 H262"/><path d="M438 150 H490"/><path d="M666 150 H718"/>
  </g>
  <text x="60" y="205" font-size="12" fill="#8d6e00">Hubo que registrar el escuchador: componente.addActionListener(this). El objeto evento viaja por la red de llamadas.</text>

  <!-- lane 2: compose -->
  <rect x="40" y="240" width="900" height="160" rx="12" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="58" y="268" font-size="15" font-weight="bold" fill="#1b5e20">COMO SE HACE EN 2026 (Jetpack Compose)</text>
  <g font-size="14" fill="#263238">
    <rect x="60" y="286" width="150" height="80" rx="8" fill="#ffffff" stroke="#7cb07c"/>
    <text x="135" y="318" text-anchor="middle">GESTO</text>
    <text x="135" y="340" text-anchor="middle" font-size="12">PointerEventType</text>
    <rect x="268" y="286" width="170" height="80" rx="8" fill="#ffffff" stroke="#7cb07c"/>
    <text x="353" y="318" text-anchor="middle">MODIFIER</text>
    <text x="353" y="334" text-anchor="middle" font-size="12">.pointerInput /</text>
    <text x="353" y="350" text-anchor="middle" font-size="12">.clickable / .onKeyEvent</text>
    <rect x="496" y="286" width="170" height="80" rx="8" fill="#ffffff" stroke="#7cb07c"/>
    <text x="581" y="318" text-anchor="middle">LAMBDA DEL</text>
    <text x="581" y="334" text-anchor="middle">PARAMETRO</text>
    <text x="581" y="352" text-anchor="middle" font-size="12">onPulsar(nota)</text>
    <rect x="724" y="286" width="196" height="80" rx="8" fill="#ffffff" stroke="#7cb07c"/>
    <text x="822" y="318" text-anchor="middle">ESTADO + RECOMPOSICION</text>
    <text x="822" y="340" text-anchor="middle" font-size="12">MutableState cambia,</text>
    <text x="822" y="356" text-anchor="middle" font-size="12">Compose repinta solo</text>
  </g>
  <g stroke="#1b5e20" stroke-width="2" fill="none" marker-end="url(#f2)">
    <path d="M210 326 H262"/><path d="M438 326 H490"/><path d="M666 326 H718"/>
  </g>
  <text x="60" y="385" font-size="12" fill="#1b5e20">No hay registro: el oyente es un parametro mas de la funcion. No viaja un objeto evento: se recibe lo que ha pasado, ya interpretado.</text>

  <defs>
    <marker id="f1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8d6e00"/></marker>
    <marker id="f2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1b5e20"/></marker>
  </defs>
</svg>
