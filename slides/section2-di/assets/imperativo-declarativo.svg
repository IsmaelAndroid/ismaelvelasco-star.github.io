<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="430" fill="#fafafa"/>
  <!-- LADO IZQUIERDO: IMPERATIVO -->
  <rect x="15" y="15" width="450" height="400" rx="14" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="240" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#E65100">IMPERATIVO — el CÓMO</text>
  <text x="240" y="78" text-anchor="middle" font-size="15" fill="#7f5b3a">"Dime los pasos, uno a uno"</text>
  <rect x="60" y="110" width="150" height="56" rx="10" fill="#FFB74D"/>
  <text x="135" y="144" text-anchor="middle" font-size="17" font-weight="bold" fill="#4E342E">Paso 1</text>
  <rect x="185" y="185" width="150" height="56" rx="10" fill="#FFA726"/>
  <text x="260" y="219" text-anchor="middle" font-size="17" font-weight="bold" fill="#4E342E">Paso 2</text>
  <rect x="310" y="260" width="150" height="56" rx="10" fill="#FB8C00"/>
  <text x="385" y="294" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Paso 3</text>
  <line x1="185" y1="150" x2="235" y2="192" stroke="#E65100" stroke-width="3" marker-end="url(#f1)"/>
  <line x1="310" y1="225" x2="360" y2="267" stroke="#E65100" stroke-width="3" marker-end="url(#f1)"/>
  <line x1="385" y1="316" x2="290" y2="352" stroke="#E65100" stroke-width="3" marker-end="url(#f1)"/>
  <rect x="110" y="348" width="190" height="50" rx="10" fill="#E65100"/>
  <text x="205" y="379" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">RESULTADO 🎯</text>
  <!-- LADO DERECHO: DECLARATIVO -->
  <rect x="495" y="15" width="450" height="400" rx="14" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="720" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565C0">DECLARATIVO — el QUÉ</text>
  <text x="720" y="78" text-anchor="middle" font-size="15" fill="#39556d">"Describe el resultado y listo"</text>
  <rect x="560" y="180" width="320" height="70" rx="12" fill="#64B5F6"/>
  <text x="720" y="210" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">"Quiero los pares</text>
  <text x="720" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">del 1 al 10"</text>
  <line x1="720" y1="250" x2="720" y2="300" stroke="#1565C0" stroke-width="4" marker-end="url(#f2)"/>
  <rect x="600" y="305" width="240" height="52" rx="10" fill="#1565C0"/>
  <text x="720" y="337" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">RESULTADO 🎯</text>
  <text x="720" y="135" text-anchor="middle" font-size="15" fill="#39556d">(sin escalones: el "quién lo hace"</text>
  <text x="720" y="155" text-anchor="middle" font-size="15" fill="#39556d">—el lenguaje o el framework— resuelve)</text>
  <defs>
    <marker id="f1" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#E65100"/></marker>
    <marker id="f2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1565C0"/></marker>
  </defs>
</svg>
