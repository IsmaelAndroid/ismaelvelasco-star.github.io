<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" font-family="Roboto, Segoe UI, Arial, sans-serif">
<rect width="900" height="290" fill="#FAFAFD" rx="0"/>
<text x="450" y="45" text-anchor="middle" font-size="24" fill="#37474F" font-weight="bold">Text — un componente, mil looks</text><text x="120" y="110" text-anchor="start" font-size="32" fill="#6750A4" font-weight="bold">Titular</text><text x="120" y="150" text-anchor="start" font-size="18" fill="#1D1B20">Soy un título (titleLarge)</text><text x="120" y="185" text-anchor="start" font-size="15" fill="#1D1B20">Soy el cuerpo del texto (bodyLarge): el que leen tus usuarios</text><text x="120" y="215" text-anchor="start" font-size="11" fill="#79747E">ETIQUETA (labelSmall)</text><text x="120" y="255" text-anchor="start" font-size="15" fill="#B3261E" font-weight="bold">Texto de color y peso</text><text x="470" y="110" text-anchor="start" font-size="13" fill="#79747E">style = MaterialTheme.typography.X</text><text x="470" y="135" text-anchor="start" font-size="13" fill="#79747E">color = MaterialTheme.colorScheme.X</text><text x="470" y="160" text-anchor="start" font-size="13" fill="#79747E">fontSize / fontWeight / fontFamily</text><text x="470" y="185" text-anchor="start" font-size="13" fill="#79747E">maxLines + overflow = ellipsis</text></svg>