<text x="450" y="42" text-anchor="middle" font-size="24" fill="#37474F" font-weight="bold">Scaffold — la pantalla con huecos preparados</text><rect x="320" y="70" width="230" height="340" rx="18" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/><rect x="320" y="70" width="230" height="54" rx="18" fill="#6750A4"/><text x="435.0" y="104" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="bold">Mi App</text><text x="435.0" y="90" text-anchor="middle" font-size="10" fill="#D0BCFF">topBar ↓</text><rect x="334" y="220" width="202" height="60" rx="8" fill="#E7E0EC"/><text x="435.0" y="255" text-anchor="middle" font-size="13" fill="#79747E">contenido (content)</text><circle cx="508" cy="320" r="22" fill="#6750A4"/><text x="508" y="327" text-anchor="middle" font-size="18" fill="#FFFFFF" font-weight="bold">＋</text><text x="508" y="362" text-anchor="middle" font-size="10" fill="#79747E">FAB</text><rect x="320" y="354" width="230" height="56" rx="18" fill="#F5EFF7"/><text x="370" y="382" text-anchor="middle" font-size="17" fill="#6750A4">⌂</text><text x="435" y="382" text-anchor="middle" font-size="17" fill="#6750A4">🔍</text><text x="500" y="382" text-anchor="middle" font-size="17" fill="#6750A4">☰</text><text x="435.0" y="402" text-anchor="middle" font-size="10" fill="#79747E">bottomBar ↑</text><text x="180" y="140" text-anchor="middle" font-size="14" fill="#1D1B20">Cada hueco es un parámetro:</text><text x="60" y="175" text-anchor="start" font-size="15" fill="#79747E">Scaffold(</text><text x="60" y="209" text-anchor="start" font-size="15" fill="#79747E">  topBar = { ... },</text><text x="60" y="243" text-anchor="start" font-size="15" fill="#79747E">  bottomBar = { ... },</text><text x="60" y="277" text-anchor="start" font-size="15" fill="#79747E">  floatingActionButton = { ... }</text><text x="60" y="311" text-anchor="start" font-size="15" fill="#79747E">) { innerPadding -&gt; }</text><text x="720" y="150" text-anchor="middle" font-size="14" fill="#607D8B">Con Scaffold divides la</text><text x="720" y="172" text-anchor="middle" font-size="14" fill="#607D8B">pantalla en zonas fijas,</text><text x="720" y="194" text-anchor="middle" font-size="14" fill="#607D8B">como los clásicos</text><text x="720" y="216" text-anchor="middle" font-size="14" fill="#607D8B">NORTE · SUR · ESTE ·</text><text x="720" y="238" text-anchor="middle" font-size="14" fill="#607D8B">OESTE · CENTRO</text></svg>