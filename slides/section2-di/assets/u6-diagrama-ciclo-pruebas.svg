<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Ciclo de diseño y pruebas de usabilidad">
<defs><marker id="punta" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#37474f"/></marker></defs>
<rect width="960" height="520" fill="#ffffff"/>
<text x="24" y="30" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#37474f">El bucle no se hace una vez: se repite hasta que la versión aguanta</text>
<rect x="24" y="70" width="256" height="86" rx="8" fill="#e8f1f8" stroke="#1a4d7a" stroke-width="1.5"/>
<text x="36" y="92" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a4d7a">1. Perfil de usuario</text>
<text x="36" y="112" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">quién lo va a usar</text>
<text x="36" y="129" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">y con qué experiencia</text>
<rect x="352" y="70" width="256" height="86" rx="8" fill="#e8f1f8" stroke="#1a4d7a" stroke-width="1.5"/>
<text x="364" y="92" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a4d7a">2. Tareas y flujos</text>
<text x="364" y="112" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">qué tiene que poder</text>
<text x="364" y="129" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">hacer, paso a paso</text>
<rect x="680" y="70" width="256" height="86" rx="8" fill="#e8f1f8" stroke="#1a4d7a" stroke-width="1.5"/>
<text x="692" y="92" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a4d7a">3. Parámetros</text>
<text x="692" y="112" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">qué se va a medir:</text>
<text x="692" y="129" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">tiempo, errores, SUS</text>
<rect x="680" y="250" width="256" height="86" rx="8" fill="#e8f1f8" stroke="#1a4d7a" stroke-width="1.5"/>
<text x="692" y="272" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a4d7a">4. Diseño y prototipo</text>
<text x="692" y="292" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">pantallas, menús,</text>
<text x="692" y="309" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">colores y fuentes</text>
<rect x="352" y="250" width="256" height="86" rx="8" fill="#e8f1f8" stroke="#1a4d7a" stroke-width="1.5"/>
<text x="364" y="272" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a4d7a">5. Expertos</text>
<text x="364" y="292" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">evaluación heurística</text>
<text x="364" y="309" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">(4 expertos, informe)</text>
<rect x="24" y="250" width="256" height="86" rx="8" fill="#e8f1f8" stroke="#1a4d7a" stroke-width="1.5"/>
<text x="36" y="272" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a4d7a">6. Usuarios</text>
<text x="36" y="292" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">tareas reales,</text>
<text x="36" y="309" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">pensar en voz alta</text>
<rect x="24" y="388" width="912" height="92" rx="8" fill="#fff4e0" stroke="#8a5a00" stroke-width="1.5"/>
<text x="36" y="410" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8a5a00">7. Rediseño y vuelta a empezar</text>
<text x="36" y="430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">Cada problema detectado se convierte en un cambio concreto; se vuelve a prototipar y a probar.</text>
<text x="36" y="447" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">Solo cuando los expertos y los usuarios dejan de encontrar fallos, la versión pasa a producción.</text>
<line x1="280" y1="113" x2="352" y2="113" stroke="#37474f" stroke-width="1.6" marker-end="url(#punta)"/>
<line x1="608" y1="113" x2="680" y2="113" stroke="#37474f" stroke-width="1.6" marker-end="url(#punta)"/>
<line x1="808" y1="156" x2="808" y2="250" stroke="#37474f" stroke-width="1.6" marker-end="url(#punta)"/>
<line x1="680" y1="293" x2="608" y2="293" stroke="#37474f" stroke-width="1.6" marker-end="url(#punta)"/>
<line x1="352" y1="293" x2="280" y2="293" stroke="#37474f" stroke-width="1.6" marker-end="url(#punta)"/>
<line x1="152" y1="336" x2="152" y2="388" stroke="#37474f" stroke-width="1.6" marker-end="url(#punta)"/>
<path d="M 480 388 C 480 356, 940 356, 940 156" fill="none" stroke="#37474f" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#punta)"/>
<text x="700" y="352" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f" font-style="italic">el bucle vuelve al prototipo</text>
</svg>