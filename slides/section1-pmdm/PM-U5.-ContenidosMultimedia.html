<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM-U5 - Contenidos multimedia</title>
  <link rel="stylesheet" href="../dist/reset.css">
  <link rel="stylesheet" href="../dist/reveal.css">
  <link rel="stylesheet" href="../dist/theme/white.css" id="theme">
  <link rel="stylesheet" href="../plugin/highlight/monokai.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js-menu@2.1.0/menu.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js-pointer@0.1.4/dist/pointer.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js-copycode@1.4.2/plugin/copycode/copycode.css">
  <link rel="stylesheet" href="../custom.css">
</head>
<body>
  <button class="slide-return" type="button" onclick="history.back()" aria-label="Volver a la página anterior" title="Volver"><span aria-hidden="true">←</span></button>
  <div class="reveal">
    <div class="slides">
      <section
        data-markdown="PM-U5.-ContenidosMultimedia.md"
        data-separator="^\n---\n$"
        data-separator-vertical="^\n\n"
        data-separator-notes="^Note:"
        data-charset="UTF-8">
      </section>
    </div>
  </div>
  <script type="module">
    import Reveal from '../dist/reveal.esm.js';
    import RevealMarkdown from '../plugin/markdown/markdown.esm.js';
    import RevealHighlight from '../plugin/highlight/highlight.esm.js';
    import RevealNotes from '../plugin/notes/notes.esm.js';
    import RevealSearch from '../plugin/search/search.esm.js';
    import RevealZoom from '../plugin/zoom/zoom.esm.js';
    import RevealMermaid from 'https://cdn.jsdelivr.net/npm/reveal.js-mermaid-plugin@11.6.0/plugin/mermaid/mermaid.esm.js';
    import RevealAnimate from 'https://cdn.jsdelivr.net/npm/reveal.js-animate@1.1.1/animate.esm.js';
    import RevealPointer from 'https://cdn.jsdelivr.net/npm/reveal.js-pointer@0.1.4/dist/pointer.esm.js';
    import RevealMenu from 'https://cdn.jsdelivr.net/npm/reveal.js-menu@2.1.0/menu.esm.js';
    import CopyCode from 'https://cdn.jsdelivr.net/npm/reveal.js-copycode@1.4.2/plugin/copycode/copycode.mjs';

    Reveal.initialize({
      margin: 0.1,
      progress: true,
      slideNumber: 'c/t',
      showSlideNumber: 'all',
      hash: true,
      menu: {
        openButton: true,
        keyboard: true,
        markers: true
      },
      copycode: {
        button: 'always',
        display: 'icons',
        tooltip: true,
        text: { copy: 'Copiar código', copied: '¡Copiado!' }
      },
      plugins: [
        RevealMarkdown,
        RevealHighlight,
        RevealNotes,
        RevealSearch,
        RevealZoom,
        RevealMermaid,
        RevealAnimate,
        RevealPointer,
        RevealMenu,
        CopyCode
      ]
    });
  </script>
</body>
</html>
