<text x="36" y="94" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a4d7a">ISO/IEC 9241 (ergonomía)</text>
<text x="36" y="114" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">10 diálogo · 11 uso · 12 información</text>
<text x="36" y="131" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">13 ayudas · 14 menús · 15 órdenes</text>
