<text x="364" y="114" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">4 principios: perceptible, operable,</text>
<text x="364" y="131" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">comprensible, robusto</text>
<text x="364" y="148" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">niveles A · AA · AAA</text>
