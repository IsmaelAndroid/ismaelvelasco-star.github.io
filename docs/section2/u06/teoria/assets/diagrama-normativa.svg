<text x="682" y="131" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">contentDescription en lo que no</text>
<text x="682" y="148" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">se lee solo</text>
<rect x="670" y="178" width="286" height="62" rx="8" fill="#fff4e0" stroke="#8a5a00" stroke-width="1.5"/>
<text x="682" y="200" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8a5a00">Material 3</text>
<text x="682" y="220" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">roles de color y tipografía</text>
<text x="682" y="237" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">escalable en sp</text>
<rect x="670" y="250" width="286" height="62" rx="8" fill="#fff4e0" stroke="#8a5a00" stroke-width="1.5"/>
<text x="682" y="272" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8a5a00">Accessibility Scanner</text>
<text x="682" y="292" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">auditoría automática del APK</text>
<rect x="300" y="430" width="380" height="92" rx="8" fill="#eceff1" stroke="#37474f" stroke-width="1.5"/>
<text x="312" y="452" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#37474f">Interfaz usable y accesible</text>
<text x="312" y="472" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#37474f">lo que se audita en la UD6 y lo que</text>
<text x="312" y="489" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#37474f">se mide en la app: contraste, toques,</text>
<text x="312" y="506" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#37474f">lectura con lector de pantalla</text>
