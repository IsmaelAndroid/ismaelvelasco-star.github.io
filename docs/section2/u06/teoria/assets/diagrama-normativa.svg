<text x="36" y="364" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">diseño centrado en el usuario</text>
<text x="36" y="381" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">métodos ergonómicos</text>
