<rect width="980" height="560" fill="#ffffff"/>
<text x="24" y="30" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#37474f">De dónde sale cada regla que se audita</text>
<text x="24" y="62" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a4d7a">ISO / IEC</text>
